
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">🍔 Foodie</a>
        <a href="index.html">Home</a>
    </nav>

    <main class="menu-container">

        <div class="menu-heading">
            <p class="tagline">OUR SPECIAL MENU</p>
            <h1>Explore Our Menu</h1>
            <p>Choose your favourite food and enjoy!</p>
        </div>

        <div id="food-container" class="food-grid">
            <p>Loading delicious food...</p>
        </div>

        <div class="order-section">
            <h2>Ready to order?</h2>
            <p>Let our kitchen prepare something delicious for you.</p>

            <button id="order-btn" class="main-btn">
                Place Your Order
            </button>
        </div>

        <div id="order-status" class="order-status">
        </div>

    </main>

    <footer>
        <p>© 2026 Foodie Restaurant. All rights reserved.</p>
    </footer>

    <script src="menu.js"></script>

</body>
</html>
